name: CI

on:
  push:
    branches: ["main", "Develop"]
  pull_request:
    branches: ["main", "Develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-cross-platform:
    name: Portable Direct (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lmstudio-unreal-agent-mcp/package-lock.json

      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python syntax gate (portable sources)
        run: python -m compileall -q install.py installer scripts skills tools

      - name: Install agent MCP dependencies for installer probes
        run: npm ci --no-fund --no-audit
        working-directory: lmstudio-unreal-agent-mcp

      - name: Portable Direct and release pytest suites
        run: python scripts/ci/run_ci_suite.py portable_direct portable_release

      - name: SAFE dry-run performs no target writes
        run: >
          python install.py --profile safe --yes --dry-run
          --skip-runtime-bootstrap
          --codex-home "${{ runner.temp }}/codex-dry"
          --lmstudio-home "${{ runner.temp }}/lmstudio-dry"
          --state-home "${{ runner.temp }}/state-dry"

      - name: Plant hermetic LMS stub for SAFE install
        shell: bash
        run: |
          python - <<'PY'
          import os
          import stat
          from pathlib import Path

          home = Path(os.environ["RUNNER_TEMP"]) / "lmstudio"
          bindir = home / "bin"
          plugin = home / "extensions" / "plugins" / "codex" / "unreal-context-compactor"
          source_manifest = Path.cwd() / "lmstudio-context-compactor-plugin" / "manifest.json"
          production = plugin / ".lmstudio" / "production.js"
          if not source_manifest.is_file():
              raise SystemExit("context compactor manifest is missing before LMS stub setup")
          bindir.mkdir(parents=True, exist_ok=True)
          plugin.mkdir(parents=True, exist_ok=True)
          if os.name == "nt":
              (bindir / "lms.cmd").write_text(
                  "\r\n".join(
                      [
                          "@echo off",
                          'if /I "%~1"=="--version" (echo lms 0.0.0-ci & exit /b 0)',
                          f'mkdir "{plugin}" >nul 2>nul',
                          f'mkdir "{production.parent}" >nul 2>nul',
                          f'copy /Y "{source_manifest}" "{plugin / "manifest.json"}" >nul',
                          f'echo module.exports = {{}}; > "{production}"',
                          "exit /b 0",
                          "",
                      ]
                  ),
                  encoding="utf-8",
              )
          else:
              script = bindir / "lms"
              script.write_text(
                  "\n".join(
                      [
                          "#!/bin/sh",
                          'if [ "$1" = "--version" ]; then echo "lms 0.0.0-ci"; exit 0; fi',
                          f'mkdir -p "{production.parent}"',
                          f'cp "{source_manifest}" "{plugin / "manifest.json"}"',
                          f"printf '%s\\n' 'module.exports = {{}};' > \"{production}\"",
                          "exit 0",
                          "",
                      ]
                  ),
                  encoding="utf-8",
              )
              script.chmod(script.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          print(f"planted lms under {bindir}")
          PY

      - name: SAFE isolated install and MCP stdio smoke
        run: >
          python install.py --profile safe --yes
          --skip-deps --skip-runtime-bootstrap
          --codex-home "${{ runner.temp }}/codex"
          --lmstudio-home "${{ runner.temp }}/lmstudio"
          --state-home "${{ runner.temp }}/state"

  windows-full:
    name: Windows Direct and release closure
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lmstudio-unreal-agent-mcp/package-lock.json

      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install agent MCP dependencies
        run: npm.cmd ci --no-fund --no-audit
        working-directory: lmstudio-unreal-agent-mcp

      - name: Fail on UTF-8 BOM in tracked text files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suffixes = @('.js', '.json', '.md', '.py', '.ps1', '.sh', '.txt', '.yml', '.yaml')
          $bomFiles = @()
          $tracked = git ls-files -z
          if ($LASTEXITCODE -ne 0) { throw "git ls-files failed" }
          foreach ($rel in ($tracked -split "`0" | Where-Object { $_ })) {
            $ext = [System.IO.Path]::GetExtension($rel).ToLowerInvariant()
            if ($suffixes -notcontains $ext) { continue }
            if (-not (Test-Path -LiteralPath $rel -PathType Leaf)) { continue }
            $bytes = Get-Content -LiteralPath $rel -AsByteStream -TotalCount 3
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              $bomFiles += $rel
            }
          }
          if ($bomFiles.Count -gt 0) {
            Write-Error ("UTF-8 BOM detected:`n" + ($bomFiles -join "`n"))
          }

      - name: Verify UTF-8 encoding
        run: python scripts/verify_encoding.py

      - name: Windows full Direct and release pytest suites
        run: >
          python scripts/ci/run_ci_suite.py
          portable_direct portable_release windows_direct windows_release

      - name: Direct deterministic repetition gate (three passes)
        run: python scripts/run_repetition_gate.py direct_repetition --repeat 3

  node-mcp:
    name: Node Direct MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lmstudio-unreal-agent-mcp/package-lock.json

      - name: Install Node MCP dependencies
        run: npm ci --no-fund --no-audit
        working-directory: lmstudio-unreal-agent-mcp

      - name: Node MCP syntax check (all source JavaScript)
        shell: pwsh
        working-directory: lmstudio-unreal-agent-mcp
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path src -Filter *.js -Recurse | ForEach-Object {
            Write-Host "Checking $($_.FullName)"
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "node --check failed: $($_.FullName)" }
          }

      - name: Node MCP full test suite
        run: npm test
        working-directory: lmstudio-unreal-agent-mcp

      - name: Root Node contract tests
        run: node --test scripts/chat_history_trim.test.js scripts/stage_campaign_verify.test.js

      - name: Repo layout verify
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\installer_support\Verify-UnrealMcp.ps1 -RepoOnly

  context-compactor:
    name: Context Compactor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lmstudio-context-compactor-plugin/package-lock.json

      - name: Install Context Compactor dependencies
        run: npm ci --no-fund --no-audit
        working-directory: lmstudio-context-compactor-plugin

      - name: Context Compactor build and full semantic test suite
        run: npm test
        working-directory: lmstudio-context-compactor-plugin

  lint-static:
    name: Lint, static, PowerShell, and OSS readiness
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install lint dependencies
        run: python -m pip install -r requirements-dev.txt ruff

      - name: Ruff Python lint
        run: ruff check scripts/ tests/ --select=E,F,W --ignore=E501,E402,F401

      - name: Python compileall
        run: python -m compileall -q install.py installer scripts skills tools tests

      - name: JavaScript syntax check (tracked Direct files)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = git ls-files -- '*.js' '*.cjs' | Where-Object { $_ -and -not $_.StartsWith('legacy_eval/') }
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "node --check failed: $file" }
          }

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failures += "$($_.FullName): $($errors[0].Message)"
            }
          }
          if ($failures.Count -gt 0) {
            Write-Error ("PowerShell parse failures:`n" + ($failures -join "`n"))
          }

      - name: rag.ps1 doctor dispatch smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File rag.ps1 doctor

      - name: Verify OSS release readiness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\installer_support\Verify-Oss-Ready.ps1

  release-package:
    name: Clean portable package closure
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build clean relocatable package
        run: >
          python scripts/build_integrated_package.py
          --output "${{ runner.temp }}/Evidence-First-Integrated"
          --zip "${{ runner.temp }}/Evidence-First-Integrated.zip"
          --print-inventory

      - name: Verify package manifest and every inventory hash
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/Evidence-First-Integrated
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from scripts import build_integrated_package as package_builder

          output = Path(os.environ["PACKAGE_OUTPUT"])
          manifest = json.loads((output / "package-manifest.json").read_text(encoding="utf-8"))
          expected_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          assert manifest["sourceGitCommit"] == expected_commit
          assert manifest["sourceTreeClean"] is True
          assert manifest["portable"] is True
          inventory_paths = package_builder._assert_clean_inventory(manifest)
          assert len(inventory_paths) == len(manifest["inventory"])
          seen = set()
          for row in manifest["inventory"]:
              relative = row["path"]
              assert relative not in seen, f"duplicate inventory path: {relative}"
              seen.add(relative)
              target = output / relative
              assert target.is_file(), f"missing inventory file: {relative}"
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              assert digest == row["sha256"], f"inventory hash mismatch: {relative}"
          assert seen, "portable inventory must not be empty"
          print(
              f"verified {len(seen)} package inventory files at {expected_commit}; "
              "forbidden inventory count: 0"
          )
          PY

      - name: Packaged Context Compactor-only install dry-run
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/Evidence-First-Integrated
        run: >
          python "${PACKAGE_OUTPUT}/install.py"
          --profile custom --components context_compactor --yes --dry-run
          --skip-runtime-bootstrap
          --codex-home "${{ runner.temp }}/codex-package-dry"
          --lmstudio-home "${{ runner.temp }}/lmstudio-package-dry"
          --state-home "${{ runner.temp }}/state-package-dry"
